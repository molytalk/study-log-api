services:
  - type: web
    name: study-log-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn study_log.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STUDY_LOG_DB
        value: /opt/render/project/src/logs.db
